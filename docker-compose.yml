services:
  srsdocker:
    build:
      context: .
    container_name: srsdocker
    network_mode: bridge
    env_file:
      # Runtime configuration is gitignored, so this file is optional on a fresh clone.
      - path: ./mapping/config/.env
        required: false
    ports:
      - "9044:9044"
    volumes:
      - ./app.py:/app/app.py
      - ./web:/app/web
      - ./mapping:/app/mapping
    restart: unless-stopped
