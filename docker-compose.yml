services:
  srsdocker:
    build:
      context: .
    container_name: srsdocker
    network_mode: bridge
    env_file:
      - ./mapping/config/.env
    ports:
      - "9044:9044"
    volumes:
      - ./app.py:/app/app.py
      - ./web:/app/web
      - ./mapping:/app/mapping
    restart: unless-stopped
